ext {
	craftbukkitVersion = '1.21.11-R0.1-SNAPSHOT'
}

apply from: rootProject.file('modules/shared/nmsModulePaper.gradle')


dependencies {
	// The dev bundle omits the version of adventure-text-serializer-ansi and does not expose
	// DataFixerUpper on the compile classpath:
	implementation platform('net.kyori:adventure-bom:4.26.1')
	compileOnly 'com.mojang:datafixerupper:9.0.19'
	testImplementation 'com.mojang:datafixerupper:9.0.19'
	testRuntimeOnly 'com.mojang:authlib:7.0.61'
	testRuntimeOnly 'com.mojang:logging:1.6.11'
	testRuntimeOnly 'com.mojang:jtracy:1.0.37'
}
