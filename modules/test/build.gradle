plugins {
	id 'java-library'
	id 'org.checkerframework'
	id 'eclipse'
	id 'io.papermc.paperweight.userdev'
}

dependencies {
	testImplementation project(':shopkeepers-main')
	testImplementation project(path: ':shopkeepers-v26_3_R1_paper')
	// Includes the Paper API and server:
	paperweight.paperDevBundle('26.3.build.+')
	testImplementation libs.junit
	testImplementation libs.hamcrest
}

// Note: There is no need to remap the test classes to run them.
test {
	exclude 'com/nisovin/shopkeepers/PerformanceTests.class'
}

jar {
	// No output artifacts required.
	enabled = false
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

java.disableAutoTargetJvm()
