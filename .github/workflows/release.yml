# Builds the plugin on every push to master, and publishes a GitHub release when a version tag
# (e.g. v2.28.2) is pushed.
name: Release

on:
  push:
    branches:
    - master
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'
    - name: Build Shopkeepers
      # The tag (without the leading 'v') replaces the snapshot version:
      run: |
        set -o pipefail
        VERSION_ARG=()
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION_ARG=(-Pversion="${GITHUB_REF_NAME#v}"); fi
        ./gradlew build "${VERSION_ARG[@]}" --no-daemon --console=plain 2>&1 | tee build.log
    - name: Report build errors
      if: failure()
      # Annotations are visible without signing in, unlike the raw logs:
      run: |
        { grep -E -A8 "What went wrong" build.log; grep -E "error:|ERROR in|FAILED" build.log; } | head -40 | while IFS= read -r line; do
          echo "::error::$line"
        done
    - name: Publish release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        name: FoliaShopkeepers ${{ github.ref_name }}
        files: modules/dist/build/libs/Shopkeepers-*.jar
        fail_on_unmatched_files: true
        body: |
          Paper and Folia fork of Shopkeepers.

          **Supported versions** (one jar for all):
          - Paper: 1.21.11, 26.1.2, 26.2, 26.3
          - Folia: 1.21.11

          Back up `plugins/Shopkeepers/` before updating. Existing shop data loads as-is.
