rootProject.name = 'shopkeepers'

// Project name -> folder inside 'modules/'.
// Version modules live in 'versions/<Minecraft version>'. Their project names
// match the compat version ids and Java packages, which are resolved by name at runtime.
def subprojects = [
	'external-annotations': 'external-annotations',
	'api': 'api',
	'main': 'main',
	'paper': 'paper',
	'v1_21_R9_paper': 'versions/1.21.11',
	'v26_1_R1_paper': 'versions/26.1.2',
	'v26_2_R1_paper': 'versions/26.2',
	'v26_3_R1_paper': 'versions/26.3',
	'test': 'test',
	'dist': 'dist'
]

subprojects.each { subproject, folder ->
	include subproject
	project(":${subproject}").projectDir = file("modules/${folder}")
	project(":${subproject}").name = "shopkeepers-${subproject}"
}
